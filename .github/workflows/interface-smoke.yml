name: Android interface smoke
on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/**'
      - 'tools/smoke_ui.py'
      - '.github/workflows/interface-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faceit-interface-${{ github.ref }}
  cancel-in-progress: true
jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build the application
        run: gradle --no-daemon assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise navigation and capture light, dark and large type
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 tools/smoke_ui.py
      - name: Upload built-app screenshots and hierarchy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FaceIt-interface-review
          path: work/ui-smoke/
          if-no-files-found: warn
